[build-system]
requires = [
  "scikit-build-core>=0.12.0",
  "setuptools_scm>=8",
  "cython",
  "numpy"
]
build-backend = "scikit_build_core.build"

[project]
name = "flowstab"
description = "Framework for dynamic community detection in temporal networks."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name="Alexandre Bovet", email="alexandre.bovet@uzh.ch"},
]
classifiers = [
  "Programming Language :: Python :: 3",
]
dependencies = [
    "cython>=3.2.4",
    "hickle>=5.0.3",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "psutil>=7.2.2",
    "scipy>=1.15.3",
]
dynamic = ["version"]

[project.optional-dependencies]
mkl = [
  "sparse-dot-mkl>=0.9.10",
]

[dependency-groups]
testing = [
  "pytest>=9.0.2",
  "pytest-cov>=7.1.0",
  "pytest-memray>=1.8.0",
  "ruff>=0.15.7",
  "sparse-dot-mkl>=0.9.10",
]
docs = [
  "insegel>=1.3.1",
  "myst-parser>=4.0.1",
  "sphinx>=8.1.3",
  "sphinx-autoapi>=3.8.0",
]
dev = [
  { include-group = "testing" },
  { include-group = "docs" },
]

[project.scripts]
run_clusterings = "flowstab.scripts.run_clusterings:main"
run_cov_integrals = "flowstab.scripts.run_cov_integrals:main"
run_laplacians_transmats = "flowstab.scripts.run_laplacians_transmats:main"

[project.urls]
Homepage = "https://github.com/alexbovet/flow_stability"
Repository = "https://github.com/alexbovet/flow_stability.git"

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

# 2. Expand sdist inclusions to ensure reproducible compilation from source
sdist.include = [
  "CMakeLists.txt",
  "src/flowstab/*.pyx",
  "src/flowstab/*.pxd"
]
wheel.packages = ["src/flowstab"]

# 3. Explicitly exclude generated C/C++ artifacts from the final wheel
wheel.exclude = [
  "src/flowstab/*.c",
  "src/flowstab/*.cxx",
  "src/flowstab/*.cpp"
]

[tool.setuptools_scm]
# Configuration for dynamic version extraction from source control

[tool.coverage.run]
relative_files = true
source = ["src"]
omit = ["**/_cython_subst.py"] # Optional: omit fallback files if desired

[tool.coverage.paths]
source = [
    "src/flowstab",
    "**/site-packages/flowstab"
]
